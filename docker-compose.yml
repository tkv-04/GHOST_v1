# ═══════════════════════════════════════════════
# TRACE: Ghost Protocol — Docker Compose
# ═══════════════════════════════════════════════
# Run: docker-compose up --build
# Frontend: http://localhost:5173
# Backend:  http://localhost:8000
# ═══════════════════════════════════════════════

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GHOST_SECRET_KEY=change-this-in-production
      - GHOST_ADMIN_PASS=fury-director-alpha
      - GHOST_DB_PATH=/data/ghost_protocol.db
    volumes:
      - ghost_data:/data

volumes:
  ghost_data:
